name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: input
    id: model
    attributes:
      label: NAS model
      placeholder: DXP6800 Pro
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Unraid and plugin version
      placeholder: Unraid 7.1.4, plugin 3.6
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Fans
        - LEDs
        - Front panel and power-on (buttons, beeper, power-on after power loss)
        - Dashboard widget
        - Plugin page
        - MQTT / Home Assistant
        - Install and update
        - Website
        - Other
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: diag
    attributes:
      label: Output of ugreen-nas-ctl diag
      description: Run /usr/local/emhttp/plugins/ugreen-nas-control/backend/ugreen-nas-ctl diag as root on the Unraid box and paste the output. It is anonymised and read only ([what it collects](https://github.com/ugreen-nas-control/ugreen-nas-control/blob/next/docs/cli.md#diagnostics)); it replaces the other commands.
  - type: markdown
    attributes:
      value: Remove serial numbers and IP addresses from anything you paste.
