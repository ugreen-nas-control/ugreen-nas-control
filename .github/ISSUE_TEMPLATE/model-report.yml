# Generated by docs/tools/gen-templates.ts from the model registry and web/src/features/nas/feedback.ts. Do not edit; run `just docs`.
name: Model report
description: Tell us what works on your UGREEN model.
labels: [model-report]
body:
  - type: input
    id: model
    attributes:
      label: NAS model
      description: The DMI product name (cat /sys/class/dmi/id/product_name)
      placeholder: DXP4800 Plus
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Unraid and plugin version
      placeholder: Unraid 7.1.4, plugin 5.3.1
    validations:
      required: true
  - type: textarea
    id: results
    attributes:
      label: What works on your device
      description: "One line per capability: LEDs, Fan control, Case view, Sensors, Front panel. Say works, does not work or not tried. The plugin's Feedback page fills this in."
    validations:
      required: true
  - type: textarea
    id: summary
    attributes:
      label: Check summary
      description: What the plugin found on your device.
  - type: textarea
    id: notes
    attributes:
      label: What does not work, anything else
  - type: textarea
    id: diag
    attributes:
      label: Device data (diag)
      description: 'In the plugin open Feedback, collect the data and use the button there: it copies the data and opens this form. Paste it here. By hand: run /usr/local/emhttp/plugins/ugreen-nas-control/backend/ugreen-nas-ctl diag as root on the Unraid box and paste the output. It is scrubbed (no serial numbers, IP or MAC addresses, host or drive names) and read only; what it collects: https://github.com/ugreen-nas-control/ugreen-nas-control/blob/next/docs/cli.md#diagnostics'
      placeholder: 'Paste the copied device data here (Ctrl+V / Cmd+V)'
    validations:
      required: true
  - type: markdown
    attributes:
      value: Remove serial numbers and IP addresses from anything else you paste.
