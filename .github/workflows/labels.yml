name: 'Labels (area)'

# Type labels come from the issue forms. Area labels are added here and never removed: issues from the form's
# "Area" field, PRs from the changed paths (.github/labeler.yml). Labels set by a human stay.
on:
  issues:
    types: [opened, edited]
  # pull_request_target runs with write access for fork PRs too. Safe here: no checkout, no PR code runs; the
  # labeler reads only the list of changed paths from the API and the config from the base branch.
  pull_request_target: # zizmor: ignore[dangerous-triggers] no checkout, no PR code, see above
    types: [opened, synchronize, reopened, edited]

permissions: {}

jobs:
  issue:
    if: ${{ github.repository == 'ugreen-nas-control/ugreen-nas-control' && (github.event_name == 'issues') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      # "Confirm my device" in the plugin opens issues/new?labels=model-report; GitHub drops that label for users
      # without write access, so the title it sets is the signal.
      - name: Label model reports from the plugin
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          TITLE: ${{ github.event.issue.title }}
        run: |
          case "$TITLE" in
            "Model report:"*) gh issue edit "$NUMBER" --add-label 'model-report' ;;
          esac

      - name: Add the area label from the form
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.issue.number }}
          BODY: ${{ github.event.issue.body }}
        run: |
          area=$(printf '%s\n' "$BODY" | tr -d '\r' | awk '/^### Area[[:space:]]*$/ {f=1; next} f && NF {print; exit}')
          case "$area" in
            "Fans") label='area: fans' ;;
            "LEDs") label='area: leds' ;;
            "Front panel and power-on (buttons, beeper, power-on after power loss)") label='area: panel' ;;
            "Dashboard widget") label='area: widget' ;;
            "Plugin page") label='area: ui' ;;
            "MQTT / Home Assistant") label='area: mqtt' ;;
            "Install and update") label='area: install' ;;
            "Website") label='area: site' ;;
            *) exit 0 ;;
          esac
          gh issue edit "$NUMBER" --add-label "$label"

  pull-request:
    if: ${{ github.repository == 'ugreen-nas-control/ugreen-nas-control' && (github.event_name == 'pull_request_target' && github.event.action != 'edited') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          sync-labels: false

  # `main` holds releases only. Only the release PR (`release/*` from this repository) may target it; any other PR
  # opened against, or edited to, `main` moves to `next`. No checkout, no PR code; PR data only through env.
  retarget:
    if: >-
      ${{ github.repository == 'ugreen-nas-control/ugreen-nas-control'
      && github.event_name == 'pull_request_target'
      && github.event.pull_request.base.ref == 'main'
      && (github.event.action != 'edited' || github.event.changes.base != null)
      && !(github.event.pull_request.head.repo.full_name == github.repository
      && startsWith(github.event.pull_request.head.ref, 'release/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    steps:
      - name: Retarget to next and tell the author
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NUMBER: ${{ github.event.pull_request.number }}
          COMMENT: 'Thanks! PRs go to `next`; `main` only gets releases. I have changed the target for you, nothing to do on your side.'
        run: |
          gh api -X PATCH "repos/$GH_REPO/pulls/$NUMBER" -f base=next
          gh api -X POST "repos/$GH_REPO/issues/$NUMBER/comments" \
            -f body="$COMMENT"
